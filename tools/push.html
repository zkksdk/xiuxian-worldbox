<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="viewport" content="width=412, initial-scale=1.0, user-scalable=yes"><meta charset="utf-8"><title>push</title>
<style>body{background:#111;color:#0f0;font:12px/1.6 monospace;padding:10px;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">准备中…</pre>
<script src="./tok.js"></script>
<script>
(async function () {
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += '\n' + s; };
  const TOK = window.__TOK;
  if (!TOK) { out.textContent = 'NO_TOKEN: tok.js 缺失'; return; }
  const OWNER = 'zkksdk', REPO = 'xiuxian-worldbox', BRANCH = 'main';
  const API = 'https://api.github.com';
  const H = { 'Authorization': 'token ' + TOK, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  const enc = (s) => btoa(unescape(encodeURIComponent(s)));

  const FILES = [
    'index.html', 'README.md', '交接文档.md', '生态设计-v1.md',
    'css/style.css',
    'js/config.js', 'js/util.js', 'js/decor.js', 'js/brain.js', 'js/world.js',
    'js/units.js', 'js/sects.js', 'js/events.js', 'js/render.js', 'js/fx.js',
    'js/icons.js', 'js/powers.js', 'js/ui.js', 'js/save.js', 'js/main.js',
    'tools/build.py', 'tools/pack.html', 'tools/push.html'
  ];

  function readLocal(p) {
    try {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', '../' + p, false);   // 同步 XHR：minis:// 下 fetch 读不到本地文件
      xhr.send();
      if (xhr.status === 200 || xhr.status === 0) return xhr.responseText;
    } catch (e) { return null; }
    return null;
  }

  async function api(path, opt) {
    const r = await fetch(API + path, Object.assign({ headers: H }, opt || {}));
    return r;
  }

  try {
    // 1. 建仓库（已存在则忽略）
    let r = await api('/user/repos', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, H),
      body: JSON.stringify({ name: REPO, description: '太虚演天 · 修仙世界模拟器（上帝模拟器）', private: false, auto_init: false })
    });
    log(r.ok ? '✔ 仓库已创建' : (r.status === 422 ? '· 仓库已存在' : '✗ 建仓失败 ' + r.status));

    // 2. 逐个上传
    let ok = 0, fail = [];
    for (const f of FILES) {
      const content = readLocal(f);
      if (content === null) { fail.push(f + '(读取失败)'); continue; }
      let sha = null;
      const g = await api('/repos/' + OWNER + '/' + REPO + '/contents/' + encodeURIComponent(f));
      if (g.ok) { try { sha = (await g.json()).sha; } catch (e) {} }
      const body = { message: 'update ' + f, content: enc(content), branch: BRANCH };
      if (sha) body.sha = sha;
      const p = await api('/repos/' + OWNER + '/' + REPO + '/contents/' + encodeURIComponent(f), {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, H),
        body: JSON.stringify(body)
      });
      if (p.ok) { ok++; log('  ↑ ' + f); }
      else { fail.push(f + '(' + p.status + ')'); }
    }
    log('上传结果：成功 ' + ok + ' / ' + FILES.length + (fail.length ? '，失败: ' + fail.join(', ') : ''));

    // 3. 开启 Pages
    const pg = await api('/repos/' + OWNER + '/' + REPO + '/pages', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, H),
      body: JSON.stringify({ source: { branch: BRANCH, path: '/' } })
    });
    log(pg.ok ? '✔ Pages 已开启' : (pg.status === 409 ? '· Pages 已存在' : '✗ Pages ' + pg.status));

    log('\n线上地址：https://' + OWNER + '.github.io/' + REPO + '/');
    log('DONE');
  } catch (e) {
    log('ERR: ' + e.message);
  }
})();
</script>
</body>
</html>
